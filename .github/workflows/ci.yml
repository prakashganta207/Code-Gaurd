name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Same Makefile targets as local development.
      - name: Setup
        run: make setup PYTHON=python

      - name: Lint
        run: make lint

      # `make test` excludes tests marked `slow` (GPU, Ollama, CodeQL, network).
      - name: Unit tests
        run: make test

      - name: CLI smoke test
        run: .venv/bin/codeguard --help
