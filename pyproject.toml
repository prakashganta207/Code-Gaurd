[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard"
version = "0.0.1"
description = "Detect and automatically repair security vulnerabilities in LLM-generated Python code."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Prakash Ganta" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "bandit>=1.7.10",
    "semgrep>=1.90",
]

[project.optional-dependencies]
# PyTorch is NOT listed: install the CUDA build from https://pytorch.org/get-started/locally/ first.
ml = [
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "mlflow>=2.17",
]
# Tool versions match .pre-commit-config.yaml so local, hook and CI results agree.
dev = [
    "pytest>=8.3",
    "pre-commit>=4.0",
    "ruff==0.6.9",
    "black==24.10.0",
]

[project.scripts]
codeguard = "codeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]
extend-exclude = ["data", "runs", "web"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, S: bandit-style checks
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs GPU, Ollama, CodeQL or network; excluded from CI"]
